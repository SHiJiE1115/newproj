name: VPS3 offline evidence audit
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rrnc-vps3-offline
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify fixed retained bundle offline
        run: python3 -I -X utf8 -B evidence/vps3/run_offline.py --output-dir ci-results/vps3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: vps3-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-results/vps3/verification.json
            ci-results/vps3/run_context.json
            ci-results/vps3/stdout.txt
            ci-results/vps3/stderr.txt
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: false
