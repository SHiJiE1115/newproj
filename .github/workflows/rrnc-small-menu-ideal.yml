name: Small-menu certificate-ideal exact replay

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rrnc-small-menu-ideal-replay
  cancel-in-progress: false

jobs:
  verify-small-menu-ideal:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out selected source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Replay exact three-query ideal proof
        shell: bash
        run: >-
          python3 -I -X utf8 -B theory/small_menu_randomization_v01/run_hosted_small_menu_v01.py
          --execution-kind github-actions
          --expect-freeze-sha256 403e0b3a7becab752a7f02eaaebcec3396fcee0a07db9b0185154a0dc9d953c7
          --output-dir ci-results/small-menu
      - name: Retain real success or failure receipts
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: small-menu-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-results/small-menu/*.json
            ci-results/small-menu/*.txt
            ci-results/small-menu/checker-output/*.json
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: false
